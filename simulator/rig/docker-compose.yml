name: signalk-sim-rig

services:
  signalk:
    build:
      context: ../..
      dockerfile: simulator/rig/Dockerfile
    container_name: signalk-sim-rig
    ports:
      # Loopback only: the rig has no security configured, so anyone who can reach it
      # can write to it.
      - '127.0.0.1:4770:3000'
      # NMEA 0183 over TCP, for a chart plotter: the own boat and the AIS targets
      - '127.0.0.1:4772:10110'
    volumes:
      # The samples, including depth grids fetched and licensed AIS prepared on this
      # machine, which are not part of the image.
      - ../samples:/home/node/signalk/simulator/samples:ro
